name: Tests

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        php: [8.5, 8.4, 8.3]
        stability: [prefer-lowest, prefer-stable]
        firebird: [5]
      fail-fast: false

    name: PHP ${{ matrix.php }}, Firebird ${{ matrix.firebird }}, ${{ matrix.stability }}

    services:
      firebird:
        image: firebirdsql/firebird:${{ matrix.firebird }}
        env:
          FIREBIRD_DATABASE: "database.fdb"
          FIREBIRD_ROOT_PASSWORD: "masterkey"
          FIREBIRD_USE_LEGACY_AUTH: "true"
        ports:
          - 3050:3050

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_firebird
          coverage: none

      - name: Install dependencies
        run: |
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit
